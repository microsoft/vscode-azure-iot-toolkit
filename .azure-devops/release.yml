trigger: none
pr: none

parameters:
  - name: mode
    displayName: Release mode
    type: string
    default: 'Dry run'
    values:
      - 'Dry run'
      - Preview
      - GA
  - name: sourceRef
    displayName: 'Source ref (Dry run: branch or tag; Preview/GA: tag)'
    type: string
    default: refs/heads/master

variables:
  - group: 'vscode-iot-toolkit-integration-config'
  - name: nodeVersion
    value: '24.x'
  - name: extensionSourceDirectory
    value: $(Agent.TempDirectory)/release-source
  - ${{ if ne(parameters.mode, 'Dry run') }}:
      - group: 'vscode-iot-toolkit-release-config'

resources:
  repositories:
    - repository: governedTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/stable

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@governedTemplates
  parameters:
    pool:
      name: Azure Pipelines
      image: ubuntu-24.04
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Azure Pipelines
        image: windows-2025
        os: windows
    stages:
      - template: templates/release-stages.yml
        parameters:
          mode: ${{ parameters.mode }}
          sourceRef: ${{ parameters.sourceRef }}
