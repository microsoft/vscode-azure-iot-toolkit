parameters:
  - name: mode
    type: string
  - name: sourceRef
    type: string

steps:
  - checkout: none

  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      version: $(nodeVersion)

  - script: >-
      node "$(Pipeline.Workspace)/release-candidate/releasePipeline.js" verify-candidate
      --candidate-directory "$(Pipeline.Workspace)/release-candidate"
      --mode "$MODE" --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT"
    name: verify
    displayName: 'Verify release candidate'
    env:
      MODE: ${{ parameters.mode }}
      SOURCE_REF: ${{ parameters.sourceRef }}
      SOURCE_COMMIT: $(sourceCommit)
